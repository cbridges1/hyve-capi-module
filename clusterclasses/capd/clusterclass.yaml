# Reference ClusterClass for hyve-capi-module's flavor: capd — Docker
# nodes (CAPD) with a kubeadm control plane and one worker
# MachineDeployment class. Adapted from Cluster API v1.12.7's
# test/infrastructure/docker/templates/clusterclass-quick-start.yaml:
#
# - No /var/run/docker.sock mount into the nodes (the upstream test harness
#   needs it; here it would give every workload cluster root on the Docker
#   host).
# - No MachinePool class, and no imageRepository/etcd/coreDNS variables.
# - An extraCertSANs variable, so the API server's certificate also covers
#   an address hyve reaches it on through a relay (see the module's auth).
#
# No namespaces: apply with -n (the module's params.cluster_class_path
# does). Needs the core, kubeadm, and docker providers, with
# CLUSTER_TOPOLOGY=true. Pair with ../flannel (CAPD installs no CNI).
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: capd
spec:
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: capd-control-plane
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: DockerMachineTemplate
        name: capd-control-plane
    healthCheck:
      checks:
        unhealthyNodeConditions:
          - type: Ready
            status: Unknown
            timeoutSeconds: 300
          - type: Ready
            status: "False"
            timeoutSeconds: 300
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: DockerClusterTemplate
      name: capd-cluster
  workers:
    machineDeployments:
      - class: default-worker
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            name: capd-default-worker
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: DockerMachineTemplate
            name: capd-default-worker
        healthCheck:
          checks:
            unhealthyNodeConditions:
              - type: Ready
                status: Unknown
                timeoutSeconds: 300
              - type: Ready
                status: "False"
                timeoutSeconds: 300
  variables:
    - name: extraCertSANs
      required: false
      schema:
        openAPIV3Schema:
          type: array
          items:
            type: string
          default: []
          description: Extra names/IPs for the API server certificate, beyond the defaults.
    - name: podSecurityStandard
      required: false
      schema:
        openAPIV3Schema:
          type: object
          properties:
            enabled:
              type: boolean
              default: true
            enforce:
              type: string
              default: baseline
            audit:
              type: string
              default: restricted
            warn:
              type: string
              default: restricted
  patches:
    - name: certSANs
      description: Adds extraCertSANs to the API server certificate.
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/certSANs
              valueFrom:
                template: |
                  [localhost, 127.0.0.1, 0.0.0.0{{ range .extraCertSANs }}, {{ . }}{{ end }}]
    - name: customImage
      description: Runs each machine on the kindest/node image matching its Kubernetes version.
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: DockerMachineTemplate
            matchResources:
              machineDeploymentClass:
                names:
                  - default-worker
          jsonPatches:
            - op: add
              path: /spec/template/spec/customImage
              valueFrom:
                template: |
                  kindest/node:{{ .builtin.machineDeployment.version | replace "+" "_" }}
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: DockerMachineTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/customImage
              valueFrom:
                template: |
                  kindest/node:{{ .builtin.controlPlane.version | replace "+" "_" }}
    - name: podSecurityStandard
      description: Adds a PodSecurity admission configuration to the kube-apiserver.
      enabledIf: "{{ .podSecurityStandard.enabled }}"
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs
              value:
                - name: admission-control-config-file
                  value: /etc/kubernetes/kube-apiserver-admission-pss.yaml
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraVolumes
              value:
                - name: admission-pss
                  hostPath: /etc/kubernetes/kube-apiserver-admission-pss.yaml
                  mountPath: /etc/kubernetes/kube-apiserver-admission-pss.yaml
                  readOnly: true
                  pathType: File
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files
              valueFrom:
                template: |
                  - content: |
                      apiVersion: apiserver.config.k8s.io/v1
                      kind: AdmissionConfiguration
                      plugins:
                      - name: PodSecurity
                        configuration:
                          apiVersion: pod-security.admission.config.k8s.io/v1
                          kind: PodSecurityConfiguration
                          defaults:
                            enforce: "{{ .podSecurityStandard.enforce }}"
                            enforce-version: "latest"
                            audit: "{{ .podSecurityStandard.audit }}"
                            audit-version: "latest"
                            warn: "{{ .podSecurityStandard.warn }}"
                            warn-version: "latest"
                          exemptions:
                            usernames: []
                            runtimeClasses: []
                            namespaces: [kube-system, kube-flannel]
                    path: /etc/kubernetes/kube-apiserver-admission-pss.yaml
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DockerClusterTemplate
metadata:
  name: capd-cluster
spec:
  template:
    spec: {}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlaneTemplate
metadata:
  name: capd-control-plane
spec:
  template:
    spec:
      kubeadmConfigSpec:
        clusterConfiguration:
          apiServer:
            certSANs: [localhost, 127.0.0.1, 0.0.0.0]
        initConfiguration:
          nodeRegistration:
            # A non-empty kubeletExtraArgs is required for CAPD's own
            # node-registration injection; eviction thresholds are disabled
            # because kind nodes report the host's disk.
            kubeletExtraArgs:
              - name: eviction-hard
                value: nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%
        joinConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
              - name: eviction-hard
                value: nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DockerMachineTemplate
metadata:
  name: capd-control-plane
spec:
  template:
    spec: {}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DockerMachineTemplate
metadata:
  name: capd-default-worker
spec:
  template:
    spec: {}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: capd-default-worker
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            - name: eviction-hard
              value: nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%
