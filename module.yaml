apiVersion: v1
kind: Module
metadata:
  name: capi
  version: 0.1.0
  description: >-
    Kubernetes clusters built by Cluster API from a ClusterClass on a CAPI
    management cluster — hyve creates, scales, upgrades, deletes, and
    authenticates to them by driving that cluster's Cluster objects with
    kubectl; CAPI's own controllers do the machine-level work. Two flavors,
    each needing a matching ClusterClass on the management cluster: capd
    (Docker nodes, via CAPD) and gke (managed GKE, via CAPG). Every
    op talks to the management cluster through HYVE_MGMT_KUBECONFIG, which
    hyve provides because of requirements.mgmtCluster below.
  author: Hyve
  license: MIT
  tags:
    - cluster-api
    - capd
    - kubernetes
  type: driver
spec:
  runner:
    # Cluster mode: kubectl plus a POSIX shell and base64.
    image: alpine/k8s:1.34.12
  params:
    - name: flavor
      description: >-
        capd (Docker nodes: kubeadm control plane, MachineDeployment workers,
        flannel, NodePort relay) or gke (managed GKE: MachinePool workers,
        GKE's own CNI and public endpoint). Fixed at create.
      default: capd
      choices: [capd, gke]
    - name: cluster_class
      description: ClusterClass to build the cluster from, in the namespace below (default capd or gke, by flavor)
    - name: kubernetes_version
      description: >-
        Kubernetes version. capd (default v1.34.8): a kindest/node image tag
        must exist for it. gke (default v1.35.8): a version the gke
        ClusterClass's GKE release channel offers in its location.
    - name: control_plane_count
      description: Control plane machines (capd only — GKE manages its own)
      default: "1"
    - name: worker_count
      description: Worker nodes (capd's md-0 MachineDeployment, or gke's mp-0 MachinePool)
      default: "1"
    - name: machine_type
      description: GCE machine type for gke worker nodes
      default: e2-medium
    - name: namespace
      description: Management-cluster namespace holding the ClusterClass and the cluster's objects
      default: capi-clusters
    - name: api_host
      description: >-
        Address hyve and kubectl reach the cluster's API server on. Defaults
        to the management cluster's node IP (see auth.yaml's NodePort relay).
        capd only.
  requirements:
    # The hyve cluster (in the consuming repo) that runs Cluster API and
    # this module's ClusterClasses. hyve reads it from here, not from
    # params, so a different name means a fork or a different version.
    mgmtCluster: unraid-k3s
    tools:
      - name: kubectl
        description: Kubernetes CLI — every op talks to the management cluster with it
