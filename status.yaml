apiVersion: v1
kind: Workflow
metadata:
  name: status
  description: >-
    Maps the CAPI Cluster's state to hyve's status vocabulary. ACTIVE needs
    the Cluster's Available condition (control plane and workers available)
    with no change in flight, not just phase Provisioned, which only means
    the API endpoint exists. Deleting maps to DELETING, never FAILED —
    FAILED on a cluster that isn't marked for deletion makes hyve re-run
    create.
spec:
  jobs:
    - name: status
      steps:
        - name: connect
          # Same preamble in every op: hyve runs a module's scripts with cwd
          # set to the consuming repo, so there's no shared file to source.
          script: |
            name="$HYVE_CLUSTER_NAME"
            ns="${HYVE_PARAM_NAMESPACE:-capi-clusters}"
            if [ -z "$HYVE_MGMT_KUBECONFIG" ]; then
              echo "Error: HYVE_MGMT_KUBECONFIG is not set — hyve provides it for modules with requirements.mgmtCluster" >&2
              exit 1
            fi
            mk() { kubectl --kubeconfig "$HYVE_MGMT_KUBECONFIG" -n "$ns" "$@"; }
            cluster_res=clusters.v1beta2.cluster.x-k8s.io

            # cluster_exists: 0 if the Cluster exists, 1 if it doesn't, and
            # exits on any other error — an unreachable management cluster
            # must never read as "not found".
            cluster_exists() {
              if out=$(mk get "$cluster_res" "$name" -o name 2>&1); then
                return 0
              fi
              case "$out" in
                *NotFound*|*"not found"*) return 1 ;;
              esac
              echo "Error: can't read Cluster $ns/$name from the management cluster: $out" >&2
              exit 1
            }

        - name: check
          script: |
            if ! cluster_exists; then
              echo "HYVE_CLUSTER_STATUS=NOT_FOUND"
              exit 0
            fi

            cond() { printf '{.status.conditions[?(@.type=="%s")].%s}' "$1" "${2:-status}"; }
            jp="{.metadata.deletionTimestamp}|{.status.phase}|{.metadata.generation}|{.status.observedGeneration}"
            for c in Available ControlPlaneAvailable RollingOut ScalingUp ScalingDown TopologyReconciled; do
              jp="$jp|$(cond "$c")"
            done
            jp="$jp|$(cond TopologyReconciled reason)"
            fields=$(mk get "$cluster_res" "$name" -o jsonpath="$jp")
            IFS='|' read -r deleting phase generation observed available cp_available rolling scaling_up scaling_down topology topology_reason <<FIELDS
            $fields
            FIELDS
            echo "phase=${phase:-none} available=${available:-unknown} topology=${topology:-unknown}/${topology_reason:-none} rollingOut=${rolling:-unknown}"

            # A change in flight: CAPI hasn't caught up with the latest spec
            # yet (generation ahead of observedGeneration — right after
            # scale.yaml's patch, before any condition moves), the topology
            # is still being applied, or machines are rolling or scaling.
            in_flight=false
            if [ -n "$observed" ] && [ "$generation" != "$observed" ]; then in_flight=true; fi
            if [ "$topology" = "False" ] || [ "$rolling" = "True" ] || [ "$scaling_up" = "True" ] || [ "$scaling_down" = "True" ]; then in_flight=true; fi

            if [ -n "$deleting" ]; then
              echo "HYVE_CLUSTER_STATUS=DELETING"
            elif [ "$phase" = "Failed" ]; then
              echo "HYVE_CLUSTER_STATUS=FAILED"
            elif [ "$in_flight" = "true" ] && [ "$cp_available" = "True" ]; then
              # Available itself can drop meanwhile (workers short of their
              # new replica count), so this comes before the Available check.
              echo "HYVE_CLUSTER_STATUS=UPDATING"
            elif [ "$available" = "True" ] && [ "$in_flight" = "false" ]; then
              echo "HYVE_CLUSTER_STATUS=ACTIVE"
            else
              # First provisioning (control plane not up yet), or a cluster
              # that has lost availability: hyve waits either way.
              echo "HYVE_CLUSTER_STATUS=CREATING"
            fi
