# Generated from hyve-capi-module/gen/ by gen.py — edit those, then run `python3 gen/gen.py .`.
apiVersion: v1
kind: Workflow
metadata:
  name: status
  description: >-
    Maps the CAPI Cluster's state to hyve's status vocabulary. ACTIVE needs the Cluster's Available condition with no change in flight, not just phase Provisioned (which only means the API endpoint exists). Deleting maps to DELETING, never FAILED — FAILED on a cluster that isn't marked for deletion makes hyve re-run create.
spec:
  jobs:
    - name: status
      steps:
        - name: status
          script: |
            # --- management cluster (the same block in every op; generated by gen.py) ---
            # Where this cluster's CAPI objects live — params.management:
            #   hyve (default) — the cluster named by the template/cluster's
            #     spec.mgmtCluster, whose kubeconfig hyve passes as HYVE_MGMT_KUBECONFIG
            #   kubeconfig — a kubeconfig file at params.mgmt_kubeconfig (pipelines with
            #     an existing management cluster outside hyve)
            #   kind — a kind cluster on this machine (params.kind_cluster, default
            #     hyve-capi), created and initialized by create. Local mode only.
            name="$HYVE_CLUSTER_NAME"
            ns="${HYVE_PARAM_NAMESPACE:-capi-clusters}"
            management="${HYVE_PARAM_MANAGEMENT:-hyve}"
            kind_name="${HYVE_PARAM_KIND_CLUSTER:-hyve-capi}"
            cluster_res=clusters.v1beta2.cluster.x-k8s.io
            mgmt_kc=""
            mgmt_missing=false
            case "$management" in
              hyve)
                if [ -z "$HYVE_MGMT_KUBECONFIG" ]; then
                  echo "Error: no management cluster — set spec.mgmtCluster on the template or cluster (or params.management: kubeconfig or kind)" >&2
                  exit 1
                fi
                mgmt_kc="$HYVE_MGMT_KUBECONFIG" ;;
              kubeconfig)
                mgmt_kc="$HYVE_PARAM_MGMT_KUBECONFIG"
                if [ -z "$mgmt_kc" ] || [ ! -r "$mgmt_kc" ]; then
                  echo "Error: management: kubeconfig needs params.mgmt_kubeconfig to name a readable kubeconfig file (got '$mgmt_kc')" >&2
                  exit 1
                fi ;;
              kind)
                for tool in kind docker; do
                  if ! command -v "$tool" >/dev/null 2>&1; then
                    echo "Error: management: kind needs $tool on PATH — it runs a kind cluster with Docker on this machine, so it's local mode only" >&2
                    exit 1
                  fi
                done
                if kind get clusters 2>/dev/null | grep -qx "$kind_name"; then
                  mgmt_kc=$(mktemp)
                  kind get kubeconfig --name "$kind_name" > "$mgmt_kc"
                else
                  mgmt_missing=true
                fi ;;
              *)
                echo "Error: params.management must be hyve, kubeconfig, or kind (got '$management')" >&2
                exit 1 ;;
            esac
            mk() { kubectl --kubeconfig "$mgmt_kc" -n "$ns" "$@"; }
            # --- end management cluster ---

            if [ "$mgmt_missing" = true ]; then
              # No kind management cluster yet, so no Cluster in it either.
              echo "HYVE_CLUSTER_STATUS=NOT_FOUND"
              exit 0
            fi

            if out=$(mk get "$cluster_res" "$name" -o name 2>&1); then
              :
            else
              case "$out" in
                *NotFound*|*"not found"*) echo "HYVE_CLUSTER_STATUS=NOT_FOUND"; exit 0 ;;
              esac
              echo "Error: can't read Cluster $ns/$name from the management cluster: $out" >&2
              exit 1
            fi

            cond() { printf '{.status.conditions[?(@.type=="%s")].%s}' "$1" "${2:-status}"; }
            jp="{.metadata.deletionTimestamp}|{.status.phase}|{.metadata.generation}|{.status.observedGeneration}"
            for c in Available ControlPlaneAvailable RollingOut ScalingUp ScalingDown TopologyReconciled; do
              jp="$jp|$(cond "$c")"
            done
            jp="$jp|$(cond TopologyReconciled reason)"
            fields=$(mk get "$cluster_res" "$name" -o jsonpath="$jp")
            IFS='|' read -r deleting phase generation observed available cp_available rolling scaling_up scaling_down topology topology_reason <<FIELDS
            $fields
            FIELDS
            echo "phase=${phase:-none} available=${available:-unknown} topology=${topology:-unknown}/${topology_reason:-none} rollingOut=${rolling:-unknown}"

            in_flight=false
            if [ -n "$observed" ] && [ "$generation" != "$observed" ]; then in_flight=true; fi
            if [ "$topology" = "False" ] || [ "$rolling" = "True" ] || [ "$scaling_up" = "True" ] || [ "$scaling_down" = "True" ]; then in_flight=true; fi

            if [ -n "$deleting" ]; then
              echo "HYVE_CLUSTER_STATUS=DELETING"
            elif [ "$phase" = "Failed" ]; then
              echo "HYVE_CLUSTER_STATUS=FAILED"
            elif [ "$in_flight" = "true" ] && [ "$cp_available" = "True" ]; then
              echo "HYVE_CLUSTER_STATUS=UPDATING"
            elif [ "$available" = "True" ] && [ "$in_flight" = "false" ]; then
              echo "HYVE_CLUSTER_STATUS=ACTIVE"
            else
              echo "HYVE_CLUSTER_STATUS=CREATING"
            fi
