apiVersion: v1
kind: ClusterAuth
metadata:
  name: capi-auth
spec:
  methods:
    - name: kubeconfig
      description: >
        Reads the admin kubeconfig CAPI writes (Secret <name>-kubeconfig on
        the management cluster). A public API endpoint (GKE) is used as is;
        a private one is pointed at an address reachable from outside the
        management node. For CAPD the API server sits on
        Unraid's Docker network, which only the node itself can route to,
        so this keeps a NodePort Service on the management cluster relaying
        to it (a selector-less Service plus an EndpointSlice for the
        control plane endpoint, both owned by the Cluster so they're
        deleted with it) and uses <api_host>:<nodePort>. api_host is in the
        API server's certificate (create.yaml's extraCertSANs).
      deps:
        - kubectl
      auth:
        script: |
          set -e
          name="$HYVE_CLUSTER_NAME"
          ns="${HYVE_PARAM_NAMESPACE:-capi-clusters}"
          if [ -z "$HYVE_MGMT_KUBECONFIG" ]; then
            echo "Error: HYVE_MGMT_KUBECONFIG is not set — hyve provides it for modules with requirements.mgmtCluster" >&2
            exit 1
          fi
          mk() { kubectl --kubeconfig "$HYVE_MGMT_KUBECONFIG" -n "$ns" "$@"; }
          cluster_res=clusters.v1beta2.cluster.x-k8s.io

          endpoint=$(mk get "$cluster_res" "$name" -o jsonpath='{.spec.controlPlaneEndpoint.host}')
          endpoint_port=$(mk get "$cluster_res" "$name" -o jsonpath='{.spec.controlPlaneEndpoint.port}')
          uid=$(mk get "$cluster_res" "$name" -o jsonpath='{.metadata.uid}')
          if [ -z "$endpoint" ] || [ -z "$endpoint_port" ]; then
            echo "Error: $ns/$name has no control plane endpoint yet" >&2
            exit 1
          fi

          # Only a private endpoint needs the relay: CAPD's API server is
          # on Unraid's Docker network, which only the management node can
          # route to. A public one (GKE) is used as it is.
          case "$endpoint" in
            10.*|192.168.*|172.1[6-9].*|172.2[0-9].*|172.3[01].*) relay=true ;;
            *) relay=false ;;
          esac

          if [ "$relay" = "true" ]; then
            mk apply -f - <<RELAY
          apiVersion: v1
          kind: Service
          metadata:
            name: $name-apiserver
            namespace: $ns
            labels:
              app.kubernetes.io/managed-by: hyve
            ownerReferences:
              - apiVersion: cluster.x-k8s.io/v1beta2
                kind: Cluster
                name: $name
                uid: $uid
          spec:
            type: NodePort
            ports:
              - name: https
                port: $endpoint_port
                targetPort: $endpoint_port
                protocol: TCP
          ---
          apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: $name-apiserver
            namespace: $ns
            labels:
              kubernetes.io/service-name: $name-apiserver
              endpointslice.kubernetes.io/managed-by: hyve.io
              app.kubernetes.io/managed-by: hyve
            ownerReferences:
              - apiVersion: cluster.x-k8s.io/v1beta2
                kind: Cluster
                name: $name
                uid: $uid
          addressType: IPv4
          ports:
            - name: https
              port: $endpoint_port
              protocol: TCP
          endpoints:
            - addresses: ["$endpoint"]
          RELAY

            node_port=$(mk get service "$name-apiserver" -o jsonpath='{.spec.ports[0].nodePort}')
            api_host="${HYVE_PARAM_API_HOST:-$HYVE_CAPI_API_HOST}"
            if [ -z "$api_host" ]; then
              api_host=$(kubectl --kubeconfig "$HYVE_MGMT_KUBECONFIG" get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
            fi
          fi

          fetched=$(mktemp)
          mk get secret "$name-kubeconfig" -o jsonpath='{.data.value}' | base64 -d > "$fetched"
          if [ "$relay" = "true" ]; then
            kubectl --kubeconfig "$fetched" config set-cluster "$name" --server="https://$api_host:$node_port" >/dev/null
          fi
          # CAPI names the context <name>-admin@<name>; name it after the
          # cluster so merged kubeconfigs stay readable.
          ctx=$(kubectl --kubeconfig "$fetched" config current-context)
          if [ "$ctx" != "$name" ]; then
            kubectl --kubeconfig "$fetched" config rename-context "$ctx" "$name" >/dev/null
          fi
          mv "$fetched" "$KUBECONFIG"
          echo "✅ Kubeconfig for $name → $(kubectl --kubeconfig "$KUBECONFIG" config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
      exports: KUBECONFIG
