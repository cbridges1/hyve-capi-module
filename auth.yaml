# Generated from hyve-capi-module/gen/ by gen.py — edit those, then run `python3 gen/gen.py .`.
apiVersion: v1
kind: ClusterAuth
metadata:
  name: capi-auth
spec:
  methods:
    - name: kubeconfig
      description: >
        Reads the admin kubeconfig CAPI writes (Secret <name>-kubeconfig on
        the management cluster) and, when the API endpoint isn't reachable
        from where hyve runs, points it through a relay — see
        params.api_access.
      deps:
        - kubectl
      auth:
        script: |
          set -e
          # --- management cluster (the same block in every op; generated by gen.py) ---
          # Where this cluster's CAPI objects live — params.management:
          #   hyve (default) — the cluster named by the template/cluster's
          #     spec.mgmtCluster, whose kubeconfig hyve passes as HYVE_MGMT_KUBECONFIG
          #   kubeconfig — a kubeconfig file at params.mgmt_kubeconfig (pipelines with
          #     an existing management cluster outside hyve)
          #   kind — a kind cluster on this machine (params.kind_cluster, default
          #     hyve-capi), created and initialized by create. Local mode only.
          name="$HYVE_CLUSTER_NAME"
          ns="${HYVE_PARAM_NAMESPACE:-capi-clusters}"
          management="${HYVE_PARAM_MANAGEMENT:-hyve}"
          kind_name="${HYVE_PARAM_KIND_CLUSTER:-hyve-capi}"
          cluster_res=clusters.v1beta2.cluster.x-k8s.io
          mgmt_kc=""
          mgmt_missing=false
          case "$management" in
            hyve)
              if [ -z "$HYVE_MGMT_KUBECONFIG" ]; then
                echo "Error: no management cluster — set spec.mgmtCluster on the template or cluster (or params.management: kubeconfig or kind)" >&2
                exit 1
              fi
              mgmt_kc="$HYVE_MGMT_KUBECONFIG" ;;
            kubeconfig)
              mgmt_kc="$HYVE_PARAM_MGMT_KUBECONFIG"
              if [ -z "$mgmt_kc" ] || [ ! -r "$mgmt_kc" ]; then
                echo "Error: management: kubeconfig needs params.mgmt_kubeconfig to name a readable kubeconfig file (got '$mgmt_kc')" >&2
                exit 1
              fi ;;
            kind)
              for tool in kind docker; do
                if ! command -v "$tool" >/dev/null 2>&1; then
                  echo "Error: management: kind needs $tool on PATH — it runs a kind cluster with Docker on this machine, so it's local mode only" >&2
                  exit 1
                fi
              done
              if kind get clusters 2>/dev/null | grep -qx "$kind_name"; then
                mgmt_kc=$(mktemp)
                kind get kubeconfig --name "$kind_name" > "$mgmt_kc"
              else
                mgmt_missing=true
              fi ;;
            *)
              echo "Error: params.management must be hyve, kubeconfig, or kind (got '$management')" >&2
              exit 1 ;;
          esac
          mk() { kubectl --kubeconfig "$mgmt_kc" -n "$ns" "$@"; }
          # --- end management cluster ---

          if [ "$mgmt_missing" = true ]; then
            echo "Error: kind management cluster $kind_name doesn't exist" >&2
            exit 1
          fi

          endpoint=$(mk get "$cluster_res" "$name" -o jsonpath='{.spec.controlPlaneEndpoint.host}')
          endpoint_port=$(mk get "$cluster_res" "$name" -o jsonpath='{.spec.controlPlaneEndpoint.port}')
          uid=$(mk get "$cluster_res" "$name" -o jsonpath='{.metadata.uid}')
          if [ -z "$endpoint" ] || [ -z "$endpoint_port" ]; then
            echo "Error: $ns/$name has no control plane endpoint yet" >&2
            exit 1
          fi

          # params.api_access — how to reach the API server:
          #   direct — the endpoint as CAPI reports it (a public one, e.g. GKE)
          #   nodeport — a NodePort relay on the management cluster, for an
          #     endpoint only its nodes can route to (CAPD on a remote Docker host)
          #   docker — the port Docker publishes on this machine for the cluster's
          #     load balancer container (CAPD under a local kind cluster)
          #   auto (default) — direct for a public endpoint; for a private one,
          #     docker under management: kind, else nodeport
          access="${HYVE_PARAM_API_ACCESS:-auto}"
          if [ "$access" = auto ]; then
            case "$endpoint" in
              10.*|192.168.*|172.1[6-9].*|172.2[0-9].*|172.3[01].*)
                if [ "$management" = kind ]; then access=docker; else access=nodeport; fi ;;
              *) access=direct ;;
            esac
          fi

          server=""
          case "$access" in
            direct) ;;
            nodeport)
              mk apply -f - <<RELAY
          apiVersion: v1
          kind: Service
          metadata:
            name: $name-apiserver
            namespace: $ns
            labels:
              app.kubernetes.io/managed-by: hyve
            ownerReferences:
              - apiVersion: cluster.x-k8s.io/v1beta2
                kind: Cluster
                name: $name
                uid: $uid
          spec:
            type: NodePort
            ports:
              - name: https
                port: $endpoint_port
                targetPort: $endpoint_port
                protocol: TCP
          ---
          apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: $name-apiserver
            namespace: $ns
            labels:
              kubernetes.io/service-name: $name-apiserver
              endpointslice.kubernetes.io/managed-by: hyve.io
              app.kubernetes.io/managed-by: hyve
            ownerReferences:
              - apiVersion: cluster.x-k8s.io/v1beta2
                kind: Cluster
                name: $name
                uid: $uid
          addressType: IPv4
          ports:
            - name: https
              port: $endpoint_port
              protocol: TCP
          endpoints:
            - addresses: ["$endpoint"]
          RELAY
              node_port=$(mk get service "$name-apiserver" -o jsonpath='{.spec.ports[0].nodePort}')
              api_host="${HYVE_PARAM_API_HOST:-$HYVE_CAPI_API_HOST}"
              if [ -z "$api_host" ]; then
                api_host=$(kubectl --kubeconfig "$mgmt_kc" get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
              fi
              server="https://$api_host:$node_port" ;;
            docker)
              published=$(docker port "$name-lb" "$endpoint_port/tcp" 2>/dev/null | head -n 1)
              if [ -z "$published" ]; then
                echo "Error: no published port for container $name-lb — params.api_access: docker expects CAPD's load balancer container on this machine" >&2
                exit 1
              fi
              server="https://127.0.0.1:${published##*:}" ;;
            *)
              echo "Error: params.api_access must be auto, direct, nodeport, or docker (got '$access')" >&2
              exit 1 ;;
          esac

          fetched=$(mktemp)
          mk get secret "$name-kubeconfig" -o jsonpath='{.data.value}' | base64 -d > "$fetched"
          if [ -n "$server" ]; then
            # Connect through the relay, but verify the certificate against the
            # endpoint it was issued for.
            kubectl --kubeconfig "$fetched" config set-cluster "$name" --server="$server" --tls-server-name="$endpoint" >/dev/null
          fi
          # CAPI names the context <name>-admin@<name>; name it after the cluster so
          # merged kubeconfigs stay readable.
          ctx=$(kubectl --kubeconfig "$fetched" config current-context)
          if [ "$ctx" != "$name" ]; then
            kubectl --kubeconfig "$fetched" config rename-context "$ctx" "$name" >/dev/null
          fi
          mv "$fetched" "$KUBECONFIG"
          echo "✅ Kubeconfig for $name → $(kubectl --kubeconfig "$KUBECONFIG" config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
      exports: KUBECONFIG
