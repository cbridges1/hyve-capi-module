# Generated from hyve-capi-module/gen/ by gen.py — edit those, then run `python3 gen/gen.py .`.
apiVersion: v1
kind: Workflow
metadata:
  name: create
  description: >-
    Applies a topology-managed CAPI Cluster built from a ClusterClass and returns — CAPI provisions it asynchronously, and status reports CREATING until it's Available. Under management: kind it first makes sure the kind management cluster, Cluster API, the requested providers, and the ClusterClasses exist. Idempotent: re-applying an existing Cluster changes nothing (scale owns changes).
spec:
  jobs:
    - name: create
      steps:
        - name: create
          script: |
            # --- management cluster (the same block in every op; generated by gen.py) ---
            # Where this cluster's CAPI objects live — params.management:
            #   hyve (default) — the cluster named by the template/cluster's
            #     spec.mgmtCluster, whose kubeconfig hyve passes as HYVE_MGMT_KUBECONFIG
            #   kubeconfig — a kubeconfig file at params.mgmt_kubeconfig (pipelines with
            #     an existing management cluster outside hyve)
            #   kind — a kind cluster on this machine (params.kind_cluster, default
            #     hyve-capi), created and initialized by create. Local mode only.
            name="$HYVE_CLUSTER_NAME"
            ns="${HYVE_PARAM_NAMESPACE:-capi-clusters}"
            management="${HYVE_PARAM_MANAGEMENT:-hyve}"
            kind_name="${HYVE_PARAM_KIND_CLUSTER:-hyve-capi}"
            cluster_res=clusters.v1beta2.cluster.x-k8s.io
            mgmt_kc=""
            mgmt_missing=false
            case "$management" in
              hyve)
                if [ -z "$HYVE_MGMT_KUBECONFIG" ]; then
                  echo "Error: no management cluster — set spec.mgmtCluster on the template or cluster (or params.management: kubeconfig or kind)" >&2
                  exit 1
                fi
                mgmt_kc="$HYVE_MGMT_KUBECONFIG" ;;
              kubeconfig)
                mgmt_kc="$HYVE_PARAM_MGMT_KUBECONFIG"
                if [ -z "$mgmt_kc" ] || [ ! -r "$mgmt_kc" ]; then
                  echo "Error: management: kubeconfig needs params.mgmt_kubeconfig to name a readable kubeconfig file (got '$mgmt_kc')" >&2
                  exit 1
                fi ;;
              kind)
                for tool in kind docker; do
                  if ! command -v "$tool" >/dev/null 2>&1; then
                    echo "Error: management: kind needs $tool on PATH — it runs a kind cluster with Docker on this machine, so it's local mode only" >&2
                    exit 1
                  fi
                done
                if kind get clusters 2>/dev/null | grep -qx "$kind_name"; then
                  mgmt_kc=$(mktemp)
                  kind get kubeconfig --name "$kind_name" > "$mgmt_kc"
                else
                  mgmt_missing=true
                fi ;;
              *)
                echo "Error: params.management must be hyve, kubeconfig, or kind (got '$management')" >&2
                exit 1 ;;
            esac
            mk() { kubectl --kubeconfig "$mgmt_kc" -n "$ns" "$@"; }
            # --- end management cluster ---

            if [ "$management" = kind ]; then
              # A persistent kind cluster on this machine, made once and reused —
              # it holds every cluster's CAPI objects, so deleting it orphans them.
              if [ "$mgmt_missing" = true ]; then
                kind_cfg=$(mktemp)
                # The Docker socket mount lets CAPD (Docker nodes) run from it.
                cat > "$kind_cfg" <<KIND
            kind: Cluster
            apiVersion: kind.x-k8s.io/v1alpha4
            nodes:
              - role: control-plane
                extraMounts:
                  - hostPath: /var/run/docker.sock
                    containerPath: /var/run/docker.sock
            KIND
                echo "Creating kind management cluster $kind_name..."
                mgmt_kc=$(mktemp)
                # --kubeconfig: never touch the user's own ~/.kube/config.
                kind create cluster --name "$kind_name" --config "$kind_cfg" --kubeconfig "$mgmt_kc" ${HYVE_PARAM_KIND_NODE_IMAGE:+--image "$HYVE_PARAM_KIND_NODE_IMAGE"}
              fi

              # Cluster API plus params.providers (clusterctl infrastructure
              # providers, comma-separated: docker, gcp, aws, azure, ... — each
              # optionally pinned, docker:v1.12.7), installing only what's missing.
              # params.capi_version pins Cluster API itself (core and kubeadm); unset,
              # clusterctl installs the latest. Provider credentials come from the environment
              # the way clusterctl expects (e.g. GCP_B64ENCODED_CREDENTIALS);
              # params.init_env ("KEY=VALUE;...") adds anything else clusterctl
              # needs, such as a provider's feature flags.
              if ! command -v clusterctl >/dev/null 2>&1; then
                echo "Error: management: kind needs clusterctl on PATH to install Cluster API" >&2
                exit 1
              fi
              providers="$HYVE_PARAM_PROVIDERS"
              installed=$(kubectl --kubeconfig "$mgmt_kc" get providers.clusterctl.cluster.x-k8s.io -A \
                -o jsonpath='{range .items[*]}{.type}/{.providerName}{"\n"}{end}' 2>/dev/null || true)
              missing=""
              for provider in $(printf '%s' "$providers" | tr ',' ' '); do
                if ! printf '%s\n' "$installed" | grep -qx "InfrastructureProvider/${provider%%:*}"; then
                  missing="${missing:+$missing,}$provider"
                fi
              done
              if [ -n "$missing" ] || ! printf '%s\n' "$installed" | grep -q '^CoreProvider/'; then
                if [ -z "$providers" ]; then
                  echo "Error: management: kind needs params.providers — the clusterctl infrastructure providers to install (e.g. docker, gcp)" >&2
                  exit 1
                fi
                export CLUSTER_TOPOLOGY=true EXP_MACHINE_POOL=true
                old_ifs=$IFS; IFS=';'
                for kv in $HYVE_PARAM_INIT_ENV; do
                  IFS=$old_ifs
                  if [ -n "$kv" ]; then export "$kv"; fi
                  IFS=';'
                done
                IFS=$old_ifs
                echo "Installing Cluster API on $kind_name (infrastructure: ${missing:-$providers})..."
                pin=""
                if [ -n "$HYVE_PARAM_CAPI_VERSION" ]; then
                  v="$HYVE_PARAM_CAPI_VERSION"
                  pin="--core cluster-api:$v --bootstrap kubeadm:$v --control-plane kubeadm:$v"
                fi
                # shellcheck disable=SC2086 # $pin is several flags
                clusterctl init --kubeconfig "$mgmt_kc" $pin --infrastructure "${missing:-$providers}" --wait-providers
              fi
            fi

            if ! kubectl --kubeconfig "$mgmt_kc" get namespace "$ns" >/dev/null 2>&1; then
              kubectl --kubeconfig "$mgmt_kc" create namespace "$ns"
            fi
            # params.cluster_class_path: ClusterClass manifests (a file, a directory,
            # or a URL — relative paths from the repository hyve runs in) applied on
            # every create, so a fresh management cluster (kind) has them.
            # Retried: right after clusterctl init, the providers' admission webhooks
            # can take a minute to start serving.
            if [ -n "$HYVE_PARAM_CLUSTER_CLASS_PATH" ]; then
              tries=0
              until kubectl --kubeconfig "$mgmt_kc" apply -n "$ns" -R -f "$HYVE_PARAM_CLUSTER_CLASS_PATH"; do
                tries=$((tries + 1))
                if [ "$tries" -ge 12 ]; then
                  echo "Error: couldn't apply $HYVE_PARAM_CLUSTER_CLASS_PATH after $tries tries" >&2
                  exit 1
                fi
                echo "Retrying in 10s (the providers' webhooks may still be starting)..."
                sleep 10
              done
            fi

            # --- desired Cluster (the same block in create and scale; generated by gen.py) ---
            # Generic: any ClusterClass, on any provider. params.flavor only fills in
            # defaults for the two reference ClusterClasses (capd, gke — see README);
            # every value it sets can still be given explicitly.
            flavor="$HYVE_PARAM_FLAVOR"
            preset_vars=""        # "name=value;..." — variables a flavor adds
            default_labels=""
            default_pod_cidr=""; default_service_cidr=""
            default_cp=""; default_worker_type=machineDeployment; default_class=""; default_version=""
            case "$flavor" in
              "") ;;
              capd)
                default_class=capd; default_version=v1.34.8; default_cp=1
                default_worker_type=machineDeployment; default_labels="cni=flannel"
                default_pod_cidr=10.244.0.0/16; default_service_cidr=10.128.0.0/12 ;;
              gke)
                default_class=gke; default_version=v1.35.8; default_worker_type=machinePool
                preset_vars="machineType=${HYVE_PARAM_MACHINE_TYPE:-e2-medium}" ;;
              *) echo "Error: params.flavor must be capd, gke, or empty (got '$flavor')" >&2; exit 1 ;;
            esac
            class="${HYVE_PARAM_CLUSTER_CLASS:-$default_class}"
            version="${HYVE_PARAM_KUBERNETES_VERSION:-$default_version}"
            cp_count="${HYVE_PARAM_CONTROL_PLANE_COUNT:-$default_cp}"
            workers="${HYVE_PARAM_WORKER_COUNT:-1}"
            worker_type="${HYVE_PARAM_WORKER_TYPE:-$default_worker_type}"
            worker_class="${HYVE_PARAM_WORKER_CLASS:-default-worker}"
            labels="${HYVE_PARAM_LABELS:-$default_labels}"
            pod_cidr="${HYVE_PARAM_POD_CIDR:-$default_pod_cidr}"
            service_cidr="${HYVE_PARAM_SERVICE_CIDR:-$default_service_cidr}"
            if [ -z "$class" ] || [ -z "$version" ]; then
              echo "Error: params.cluster_class and params.kubernetes_version are required (or params.flavor for a reference ClusterClass)" >&2
              exit 1
            fi
            for n in "$cp_count" "$workers"; do
              case "$n" in
                *[!0-9]*) echo "Error: control_plane_count/worker_count must be whole numbers (got '$n')" >&2; exit 1 ;;
              esac
            done
            case "$worker_type" in
              machineDeployment) worker_list=machineDeployments; worker_name=md-0 ;;
              machinePool) worker_list=machinePools; worker_name=mp-0 ;;
              *) echo "Error: params.worker_type must be machineDeployment or machinePool (got '$worker_type')" >&2; exit 1 ;;
            esac

            # capd's API server is only reachable through a relay (see auth), so its
            # address goes in the API server's certificate now — certSANs can't be
            # added later without rolling the control plane.
            if [ "$flavor" = capd ]; then
              api_host="$HYVE_PARAM_API_HOST"
              if [ -z "$api_host" ] && [ "$management" = kind ]; then api_host=127.0.0.1; fi
              if [ -z "$api_host" ] && [ -n "$mgmt_kc" ]; then
                api_host=$(kubectl --kubeconfig "$mgmt_kc" get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
              fi
              preset_vars="extraCertSANs=[\"$api_host\"]"
            fi

            # topology variables: params.variables is "name=value;name=value", each
            # value raw YAML (a string, a number, [a, b], {k: v}); it wins over a
            # flavor's variable of the same name.
            vars_file=$(mktemp)
            : > "$vars_file"
            user_vars="$HYVE_PARAM_VARIABLES"
            add_vars() { # $1: "name=value;..." $2: skip names already in $user_vars
              old_ifs=$IFS; IFS=';'
              for kv in $1; do
                IFS=$old_ifs
                case "$kv" in
                  "") IFS=';'; continue ;;
                  *=*) ;;
                  *) echo "Error: params.variables entry '$kv' isn't name=value" >&2; exit 1 ;;
                esac
                var_name=${kv%%=*}
                if [ "$2" = skip ]; then
                  case ";$user_vars;" in *";$var_name="*) IFS=';'; continue ;; esac
                fi
                printf '      - name: %s\n        value: %s\n' "$var_name" "${kv#*=}" >> "$vars_file"
                IFS=';'
              done
              IFS=$old_ifs
            }
            add_vars "$preset_vars" skip
            add_vars "$user_vars"

            # The Cluster's topology, as YAML — create applies it under a full Cluster,
            # scale patches it in.
            topology_file=$(mktemp)
            {
              printf '  topology:\n    classRef:\n      name: %s\n    version: %s\n' "$class" "$version"
              if [ -n "$cp_count" ]; then printf '    controlPlane:\n      replicas: %s\n' "$cp_count"; fi
              printf '    workers:\n      %s:\n        - class: %s\n          name: %s\n          replicas: %s\n' "$worker_list" "$worker_class" "$worker_name" "$workers"
              if [ -s "$vars_file" ]; then printf '    variables:\n'; cat "$vars_file"; fi
            } > "$topology_file"
            # --- end desired Cluster ---

            if ! mk get clusterclasses.v1beta2.cluster.x-k8s.io "$class" -o name >/dev/null 2>&1; then
              echo "Error: ClusterClass $ns/$class not found on the management cluster — install it there, or set params.cluster_class_path" >&2
              exit 1
            fi

            cluster_file=$(mktemp)
            {
              printf 'apiVersion: cluster.x-k8s.io/v1beta2\nkind: Cluster\nmetadata:\n  name: %s\n  namespace: %s\n  labels:\n    app.kubernetes.io/managed-by: hyve\n' "$name" "$ns"
              # params.labels: "key=value,..." — e.g. for a ClusterResourceSet
              # that installs a CNI on matching clusters (capd's cni=flannel).
              for kv in $(printf '%s' "$labels" | tr ',' ' '); do
                printf '    %s: "%s"\n' "${kv%%=*}" "${kv#*=}"
              done
              printf 'spec:\n'
              if [ -n "$pod_cidr$service_cidr" ]; then
                printf '  clusterNetwork:\n'
                if [ -n "$pod_cidr" ]; then printf '    pods:\n      cidrBlocks: ["%s"]\n' "$pod_cidr"; fi
                if [ -n "$service_cidr" ]; then printf '    services:\n      cidrBlocks: ["%s"]\n' "$service_cidr"; fi
              fi
              cat "$topology_file"
            } > "$cluster_file"

            echo "Applying Cluster $ns/$name ($class $version, ${cp_count:-managed} control plane, $workers workers)..."
            mk apply -f "$cluster_file"
            if [ -n "$api_host" ]; then echo "HYVE_CAPI_API_HOST=$api_host"; fi
