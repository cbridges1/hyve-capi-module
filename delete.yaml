# Generated from hyve-capi-module/gen/ by gen.py — edit those, then run `python3 gen/gen.py .`.
apiVersion: v1
kind: Workflow
metadata:
  name: delete
  description: >-
    Deletes the CAPI Cluster and waits for it to be gone — hyve removes the cluster's definition as soon as this succeeds. CAPI's finalizers tear down workers, the control plane, then the infrastructure; auth's NodePort relay is owned by the Cluster and goes with it. The wait stops short of cluster mode's 15-minute Job deadline: past that, this fails and hyve keeps checking (status reports DELETING) until it's gone.
spec:
  jobs:
    - name: delete
      steps:
        - name: delete
          script: |
            # --- management cluster (the same block in every op; generated by gen.py) ---
            # Where this cluster's CAPI objects live — params.management:
            #   hyve (default) — the cluster named by the template/cluster's
            #     spec.mgmtCluster, whose kubeconfig hyve passes as HYVE_MGMT_KUBECONFIG
            #   kubeconfig — a kubeconfig file at params.mgmt_kubeconfig (pipelines with
            #     an existing management cluster outside hyve)
            #   kind — a kind cluster on this machine (params.kind_cluster, default
            #     hyve-capi), created and initialized by create. Local mode only.
            name="$HYVE_CLUSTER_NAME"
            ns="${HYVE_PARAM_NAMESPACE:-capi-clusters}"
            management="${HYVE_PARAM_MANAGEMENT:-hyve}"
            kind_name="${HYVE_PARAM_KIND_CLUSTER:-hyve-capi}"
            cluster_res=clusters.v1beta2.cluster.x-k8s.io
            mgmt_kc=""
            mgmt_missing=false
            case "$management" in
              hyve)
                if [ -z "$HYVE_MGMT_KUBECONFIG" ]; then
                  echo "Error: no management cluster — set spec.mgmtCluster on the template or cluster (or params.management: kubeconfig or kind)" >&2
                  exit 1
                fi
                mgmt_kc="$HYVE_MGMT_KUBECONFIG" ;;
              kubeconfig)
                mgmt_kc="$HYVE_PARAM_MGMT_KUBECONFIG"
                if [ -z "$mgmt_kc" ] || [ ! -r "$mgmt_kc" ]; then
                  echo "Error: management: kubeconfig needs params.mgmt_kubeconfig to name a readable kubeconfig file (got '$mgmt_kc')" >&2
                  exit 1
                fi ;;
              kind)
                for tool in kind docker; do
                  if ! command -v "$tool" >/dev/null 2>&1; then
                    echo "Error: management: kind needs $tool on PATH — it runs a kind cluster with Docker on this machine, so it's local mode only" >&2
                    exit 1
                  fi
                done
                if kind get clusters 2>/dev/null | grep -qx "$kind_name"; then
                  mgmt_kc=$(mktemp)
                  kind get kubeconfig --name "$kind_name" > "$mgmt_kc"
                else
                  mgmt_missing=true
                fi ;;
              *)
                echo "Error: params.management must be hyve, kubeconfig, or kind (got '$management')" >&2
                exit 1 ;;
            esac
            mk() { kubectl --kubeconfig "$mgmt_kc" -n "$ns" "$@"; }
            # --- end management cluster ---

            if [ "$mgmt_missing" = true ]; then
              echo "⚠️  kind management cluster $kind_name doesn't exist, so neither does $ns/$name's Cluster — if it was deleted while this cluster was up, its cloud resources are orphaned and need removing by hand"
              exit 0
            fi

            cluster_exists() {
              if out=$(mk get "$cluster_res" "$name" -o name 2>&1); then
                return 0
              fi
              case "$out" in
                *NotFound*|*"not found"*) return 1 ;;
              esac
              echo "Error: can't read Cluster $ns/$name from the management cluster: $out" >&2
              exit 1
            }

            if cluster_exists; then
              mk delete "$cluster_res" "$name" --wait=false
              limit=840
              waited=0
              while cluster_exists; do
                if [ "$waited" -ge "$limit" ]; then
                  echo "Error: $ns/$name still deleting after ${limit}s — hyve will keep checking until it's gone" >&2
                  exit 1
                fi
                sleep 10
                waited=$((waited + 10))
              done
              echo "✅ Cluster $ns/$name deleted"
            else
              echo "Cluster $ns/$name already gone"
            fi

            # params.kind_cleanup: true deletes the kind management cluster once it
            # holds no Clusters at all — for pipelines that create and tear down.
            if [ "$management" = kind ] && [ "$HYVE_PARAM_KIND_CLEANUP" = true ]; then
              remaining=$(kubectl --kubeconfig "$mgmt_kc" get "$cluster_res" -A -o name 2>/dev/null | wc -l | tr -d ' ')
              if [ "$remaining" = 0 ]; then
                echo "No Clusters left — deleting kind management cluster $kind_name"
                kind delete cluster --name "$kind_name"
              fi
            fi
